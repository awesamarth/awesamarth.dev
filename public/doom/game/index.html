<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DOOM</title>
    <meta name="robots" content="noindex" />
    <!--
      Chocolate Doom compiled to WebAssembly (cloudflare/doom-wasm, GPL-2.0); see SOURCE.txt.
      DOOM1.WAD is the unmodified shareware release by id Software.
      Embedded by the idkfa easter egg on awesamarth.dev; talks to the parent page with postMessage.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        outline: none;
        cursor: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <script>
      // Keep track of audio contexts so the parent can silence the game while its window is closed.
      const audioContexts = []
      for (const name of ['AudioContext', 'webkitAudioContext']) {
        const Original = window[name]
        if (!Original) continue
        window[name] = function (...args) {
          const ctx = new Original(...args)
          audioContexts.push(ctx)
          return ctx
        }
        window[name].prototype = Original.prototype
      }

      const post = (type, data) => parent !== window && parent.postMessage({ source: 'doom', type, ...data }, location.origin)
      const canvas = document.getElementById('canvas')
      let ready = false

      // A real key press for the engine (SDL listens on window and reads key/code/keyCode).
      function press(key, code, keyCode) {
        for (const type of ['keydown', 'keyup']) {
          const e = new KeyboardEvent(type, { key, code, bubbles: true, cancelable: true })
          Object.defineProperty(e, 'keyCode', { get: () => keyCode })
          Object.defineProperty(e, 'which', { get: () => keyCode })
          window.dispatchEvent(e)
        }
      }

      // Real menu state, exported from the engine (m_menu.c); key counting is only a fallback.
      const menuActive = () => (Module._doom_menu_active ? !!Module._doom_menu_active() : menuOpen)

      // The engine creates and closes a context while starting up; only touch live ones.
      const liveAudio = () => audioContexts.filter(c => c.state !== 'closed')
      let pausedByUs = false
      let quitting = false
      let started = false

      window.doom = {
        // Closing the window opens DOOM's own menu, which pauses a single-player game, then mutes it.
        pause() {
          window.__closing = true
          setTimeout(() => (window.__closing = false), 100)
          if (document.pointerLockElement) document.exitPointerLock()
          if (ready && !menuActive()) {
            press('Escape', 'Escape', 27)
            pausedByUs = true
          }
          liveAudio().forEach(c => c.suspend().catch(() => {}))
        },
        // Reopening closes the menu we opened, so you're straight back in the game.
        resume() {
          liveAudio().forEach(c => c.resume().catch(() => {}))
          if (pausedByUs && menuActive()) press('Escape', 'Escape', 27)
          pausedByUs = false
          canvas.focus()
        },
      }

      // Track DOOM's menu from Escape presses; good enough to avoid toggling it closed on pause.
      let menuOpen = false
      window.addEventListener(
        'keydown',
        e => {
          if (e.code === 'Backquote') {
            e.preventDefault()
            e.stopImmediatePropagation()
            post('close')
            return
          }
          // F = the same fullscreen as the window's button (the engine's own toggle is disabled in
          // default.cfg: it fullscreened the canvas separately and got stuck at the wrong size).
          if (e.code === 'KeyF' && !e.repeat && !(Module._doom_menu_mode && Module._doom_menu_mode() === 2)) {
            e.preventDefault()
            e.stopImmediatePropagation()
            post('fullscreen')
            return
          }
          if (e.key === 'Escape') menuOpen = !menuOpen
        },
        true,
      )
      // Browsers keep the first Esc for releasing the mouse, so the game never sees it.
      // When that happens mid-game, open DOOM's menu ourselves: one Esc does both.
      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement || !ready || quitting || window.__closing) return
        setTimeout(() => !menuActive() && press('Escape', 'Escape', 27), 0)
      })

      // Tell the page when the menu opens or closes (it shows keyboard hints).
      let lastMenu = null
      const watchMenu = () => {
        if (ready) {
          const open = menuActive()
          if (open !== lastMenu) {
            post('menu', { open: (lastMenu = open) })
            canvas.style.cursor = open ? 'default' : 'none'
          }
        }
        requestAnimationFrame(watchMenu)
      }
      requestAnimationFrame(watchMenu)

      // Point-and-click menus. DOOM's menus are 320x200 and items are 16px apart, so map the
      // cursor onto the current menu and let the engine move the skull there (m_menu.c exports).
      function menuItemAt(e) {
        if (!Module._doom_menu_count || Module._doom_menu_mode()) return -1
        const r = canvas.getBoundingClientRect()
        const x = ((e.clientX - r.left) / r.width) * 320
        const y = ((e.clientY - r.top) / r.height) * 200
        const mx = Module._doom_menu_x()
        const my = Module._doom_menu_y()
        if (x < mx - 34 || x > mx + 240) return -1
        const i = Math.floor((y - my + 3) / 16)
        return i >= 0 && i < Module._doom_menu_count() ? i : -1
      }
      window.addEventListener(
        'mousemove',
        e => {
          if (!ready || !menuActive()) return
          const i = menuItemAt(e)
          canvas.style.cursor = i >= 0 && Module._doom_menu_set_item(i) ? 'pointer' : 'default'
        },
        true,
      )
      // Capture phase, so in the menu the engine never sees the click as a mouse button.
      window.addEventListener(
        'mousedown',
        e => {
          canvas.focus()
          if (e.button !== 0) return
          if (ready && menuActive()) {
            e.preventDefault()
            e.stopImmediatePropagation()
            const mode = Module._doom_menu_mode()
            if (mode === 1) press('Enter', 'Enter', 13) // help screens: any key continues
            else if (mode === 0) {
              const i = menuItemAt(e)
              if (i >= 0 && Module._doom_menu_set_item(i)) press('Enter', 'Enter', 13)
            }
            return
          }
          // In game, the first click captures the mouse.
          if (!document.pointerLockElement) canvas.requestPointerLock?.()
        },
        true,
      )

      var Module = {
        canvas,
        noInitialRun: true,
        locateFile: path => (path.endsWith('.wasm') ? 'doom.wasm' : path),
        onRuntimeInitialized() {
          Module.callMain(['-iwad', 'doom1.wad', '-config', 'default.cfg', '-window', '-nogui', '-warp', '1', '1', '-skill', '3'])
          started = true
        },
        print(text) {
          if (location.hash === "#debug") console.log("[doom]", text)
          // Printed right before the first frame of E1M1.
          if (!ready && /emscripten_set_main_loop/.test(text)) {
            ready = true
            setTimeout(() => post('ready'), 250)
          }
        },
        // "Quit Game" exits the engine (like quitting to DOS); tell the page so it can start fresh.
        quit(status, toThrow) {
          // Emscripten also calls this when main() returns after starting the game loop: ignore that.
          if (!started) throw toThrow
          if (!quitting) post('quit', { status })
          quitting = true
          throw 'unwind' // Emscripten's silent "stop here"; the page swaps in a fresh iframe
        },
        printErr(text) {
          console.warn('[doom]', text)
        },
        monitorRunDependencies(left) {
          post('progress', { left })
        },
      }
      window.addEventListener('error', e => post('error', { message: String(e.message || e) }))

      // Files: reuse what the page preloaded when idkfa was typed (window.__doomPreload, see
      // src/components/doom/preload.ts), otherwise download them here. Everything retries.
      async function fetchWithRetry(url, tries = 3) {
        for (let i = 0; ; i++) {
          try {
            const res = await fetch(url)
            if (!res.ok) throw new Error('HTTP ' + res.status)
            return await res.arrayBuffer()
          } catch (e) {
            if (i >= tries - 1) throw e
            await new Promise(r => setTimeout(r, 1000 * (i + 1)))
          }
        }
      }
      function file(name) {
        let preloaded
        try {
          preloaded = parent.__doomPreload && parent.__doomPreload[name]
        } catch {}
        return (preloaded || Promise.reject()).catch(() => fetchWithRetry(name))
      }
      function loadScript(src, tries = 3) {
        return new Promise((resolve, reject) => {
          const attempt = n => {
            const s = document.createElement('script')
            s.src = n ? src + '?retry=' + n : src
            s.onload = resolve
            s.onerror = () => {
              s.remove()
              if (n + 1 >= tries) reject(new Error('could not load ' + src))
              else setTimeout(() => attempt(n + 1), 1000 * (n + 1))
            }
            document.body.appendChild(s)
          }
          attempt(0)
        })
      }
      Promise.all([file('doom.wasm'), file('DOOM1.WAD'), file('default.cfg')])
        .then(([wasm, wad, cfg]) => {
          Module.wasmBinary = wasm
          Module.preRun = [
            () => {
              Module.FS.writeFile('/doom1.wad', new Uint8Array(wad))
              Module.FS.writeFile('/default.cfg', new Uint8Array(cfg))
            },
          ]
          return loadScript('doom.js')
        })
        .catch(e => post('error', { message: 'Download failed (' + ((e && e.message) || 'network') + ')' }))
    </script>
  </body>
</html>
